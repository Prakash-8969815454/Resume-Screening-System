<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATS Resume Screener</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-8">
    <div class="max-w-4xl mx-auto space-y-8">
        <!-- Header -->
        <header class="text-center">
            <h1 class="text-4xl font-bold text-indigo-400">ATS Resume Screening System</h1>
            <p class="text-slate-400 mt-2">Upload candidate resumes against job descriptions to compute ML relevance scores.</p>
        </header>

        <!-- Input Form -->
        <div class="bg-slate-800 p-6 rounded-xl shadow-lg border border-slate-700">
            <form id="atsForm" class="space-y-6">
                <div>
                    <label class="block text-sm font-medium mb-2 text-indigo-300">Job Description (JD)</label>
                    <textarea id="jobDescription" rows="5" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm focus:ring-2 focus:ring-indigo-500 text-slate-200" placeholder="Paste target Job Description here..." required></textarea>
                </div>

                <div>
                    <label class="block text-sm font-medium mb-2 text-indigo-300">Upload Resume (PDF/DOCX)</label>
                    <input type="file" id="resumeFile" accept=".pdf,.docx" class="w-full text-slate-400 bg-slate-900 rounded-lg p-2 border border-slate-700" required>
                </div>

                <button type="submit" id="submitBtn" class="w-full bg-indigo-600 hover:bg-indigo-500 py-3 rounded-lg font-semibold transition">
                    Analyze Resume
                </button>
            </form>
        </div>

        <!-- Output Dashboard -->
        <div id="results" class="hidden bg-slate-800 p-6 rounded-xl shadow-lg border border-slate-700 space-y-6">
            <h2 class="text-2xl font-bold text-indigo-300 border-b border-slate-700 pb-2">Screening Results</h2>
            
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="bg-slate-900 p-4 rounded-lg text-center border border-slate-700">
                    <span class="text-xs text-slate-400 uppercase">Match Score</span>
                    <div id="scoreDisplay" class="text-3xl font-extrabold text-emerald-400 mt-1">0%</div>
                </div>
                <div class="bg-slate-900 p-4 rounded-lg border border-slate-700">
                    <span class="text-xs text-slate-400 uppercase block mb-1">Email Extracted</span>
                    <div id="emailDisplay" class="text-sm font-medium text-slate-200 truncate">N/A</div>
                </div>
                <div class="bg-slate-900 p-4 rounded-lg border border-slate-700">
                    <span class="text-xs text-slate-400 uppercase block mb-1">Phone Extracted</span>
                    <div id="phoneDisplay" class="text-sm font-medium text-slate-200">N/A</div>
                </div>
            </div>

            <div>
                <h3 class="text-sm font-semibold text-emerald-400 uppercase tracking-wide mb-2">Matched Skills</h3>
                <div id="matchedSkills" class="flex flex-wrap gap-2"></div>
            </div>

            <div>
                <h3 class="text-sm font-semibold text-rose-400 uppercase tracking-wide mb-2">Missing Skills</h3>
                <div id="missingSkills" class="flex flex-wrap gap-2"></div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('atsForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerText = "Processing...";

            const formData = new FormData();
            formData.append('job_description', document.getElementById('jobDescription').value);
            formData.append('file', document.getElementById('resumeFile').files[0]);

            try {
                const response = await fetch('/api/v1/screen', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();
                
                if (response.ok) {
                    document.getElementById('results').classList.remove('hidden');
                    document.getElementById('scoreDisplay').innerText = `${data.match_score}%`;
                    document.getElementById('emailDisplay').innerText = data.candidate_info.email;
                    document.getElementById('phoneDisplay').innerText = data.candidate_info.phone;

                    // Render Skills Badges
                    document.getElementById('matchedSkills').innerHTML = data.matched_skills.map(s => 
                        `<span class="bg-emerald-900/60 text-emerald-300 text-xs px-3 py-1 rounded-full border border-emerald-700">${s}</span>`
                    ).join('') || '<span class="text-xs text-slate-500">None detected</span>';

                    document.getElementById('missingSkills').innerHTML = data.missing_skills.map(s => 
                        `<span class="bg-rose-900/60 text-rose-300 text-xs px-3 py-1 rounded-full border border-rose-700">${s}</span>`
                    ).join('') || '<span class="text-xs text-slate-500">None</span>';
                } else {
                    alert('Error processing document: ' + data.detail);
                }
            } catch (err) {
                alert('Server Connection Error');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = "Analyze Resume";
            }
        });
    </script>
</body>
</html>
